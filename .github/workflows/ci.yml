name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifests and run unit tests
        run: npm test
      - name: Coverage limits
        run: |
          echo "npm test drives the commands against a fake OATS_CLI_BIN that models kernel 0.34.0's refusals and output shapes."
          echo "NOT COVERED here: the live rehearsal against a real kernel (spawn, session upload/start, aweb identities); see README 'Verification'."
